<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book this Las Vegas experience with Trip2Vegas. Premium tours and activities.">
  <title>Tour Details | Trip2Vegas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/vegas-theme.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body class="page-loading">
  <div id="header-placeholder"></div>

  <div id="tour-detail">
    <!-- Tour Hero -->
    <div class="tour-hero">
      <div class="tour-hero__bg" style="background: linear-gradient(135deg, var(--color-black-light), var(--color-black));"></div>
      <div class="tour-hero__overlay"></div>
      <div class="tour-hero__content" id="tour-hero-content">
        <!-- Populated by tours.js -->
      </div>
    </div>

    <!-- Tour Detail Content -->
    <section class="tour-detail">
      <div class="container">
        <div class="tour-detail__grid">
          <!-- Main Content -->
          <div id="tour-main-content">
            <!-- Populated by tours.js -->
          </div>

          <!-- Sidebar -->
          <div class="tour-detail__sidebar" id="tour-sidebar">
            <!-- Populated by tours.js -->
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Related Tours CTA -->
  <section class="cta-banner fade-in">
    <div class="cta-banner__bg"></div>
    <div class="cta-banner__content">
      <h2>
        <span data-lang-en>Want to see more?</span>
        <span data-lang-tr>Daha fazlasını görmek ister misiniz?</span>
      </h2>
      <p>
        <span data-lang-en>Browse our full catalog of 40+ Las Vegas tours and experiences.</span>
        <span data-lang-tr>40'tan fazla Las Vegas turu ve deneyimimizin tam kataloğuna göz atın.</span>
      </p>
      <a href="index.html" class="btn btn--gold btn--lg">
        <span data-lang-en>All Tours</span>
        <span data-lang-tr>Tüm Turlar</span>
      </a>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../../assets/js/language.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/tours.js"></script>
</body>
</html>
